[package]
name = "transformer"
version = "0.5.0"
edition = "2021"

[features]
default = ["gui", "demo"]
# GUI за фичей: лёгкий CLI собирается `cargo build --no-default-features`.
# gui НЕ включает demo: интерфейс не должен зависеть от встроенных примеров.
gui = ["dep:eframe", "dep:egui_plot", "dep:rfd"]
# Демонстрации: встроенные чёрные ящики, char-LM и раздел «Демо».
demo = []

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-rand = "0.15"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
calamine = { version = "0.35", default-features = false }
zip = { version = "7.2", default-features = false, features = ["deflate"] }

# Только для GUI (фича `gui`).
eframe = { version = "0.31", optional = true }
egui_plot = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
